name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh bin/clipimgpath.bash
      - name: Swift compile
        run: swiftc -framework AppKit src/clipimgpath.swift -o /tmp/clipimgpath
      - name: Install Lua
        run: brew install lua
      - name: Lua syntax
        run: luac -p hammerspoon/ghostty-screenshot-paste-bridge.lua
